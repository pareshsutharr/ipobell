name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (type check, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Placeholders only: the app refuses to load without these names. No real project is contacted.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Unit tests (jest)
        run: npx jest --ci
      - name: Registrar script tests (jsdom)
        run: npm run test:dom

  supabase:
    name: Supabase (function unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `node --test supabase/tests` (a bare directory) fails on Node 24; pass the files.
      - run: node --test supabase/tests/*.test.ts

  admin:
    name: Admin (type check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # PageProps / LayoutProps are generated by Next; without this the type check fails on a clean checkout.
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
